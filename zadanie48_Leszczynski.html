<!DOCTYPE html>

<title>Sprawdzenie danych </title>

<body> 
<div style="color:red;font-size:50px;"> 
<script language="JavaScript"> 
var suma_les = 0;

for (var i_les=1;i_les<1000000;i_les++) {
    suma_les = suma_les+1/i_les;
}

   document.writeln("suma wynosi "+suma_les.toFixed(2));

</script> 
</div>
