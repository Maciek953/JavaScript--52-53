<!DOCTYPE html> 
<html lang="pl"> 
<head>  
   <meta charset="utf-8"> 
    <title>  Przykład użycia pętli </title> 
  <script language="JavaScript"> 

  var liczba_les=prompt("Podaj liczbe =","")
  var inicjaly_les=prompt("Podaj swoje inicjaly =","")
   for ( var i=1; i<=liczba_les; i++) 
    { 
       for ( var k=1; k<=i; k++) 
        { 
           document.write("&nbsp &nbsp &nbsp");     
         } 
         document.write(i+""+inicjaly_les+""+i+"<br>"); 
     } 
  </script> 
</head>  
<body>  
</body>  
</html>
