<!DOCTYPE html> 
<html lang="pl"> 
<head>  
   <meta charset="utf-8"> 
    <title>  Przykład użycia pętli </title> 
  <script language="JavaScript"> 

var a=8;
var b=20;

document.write("&nbsp&nbsp&nbsp&nbsp&nbsp&nbsp&nbsp&nbsp&nbsp&nbsp&nbsp&nbsp&nbsp&nbsp&nbsp&nbsp&nbsp&nbspb");
document.write("<br>");

for (i=1; i<=b; i++) {
    document.write("*");
}

document.write("<br>")
for (i=1; i<=(a-2); i++) {
    document.write("* &nbsp&nbsp&nbsp&nbsp&nbsp&nbsp&nbsp&nbsp&nbsp&nbsp&nbsp&nbsp&nbsp&nbsp&nbsp&nbsp&nbsp&nbsp&nbsp&nbsp&nbsp&nbsp&nbsp&nbsp&nbsp&nbsp&nbsp&nbsp&nbsp&nbsp&nbsp&nbsp&nbsp&nbsp  *");
    if (i==4) {
        document.write("&nbsp&nbsp&nbsp&nbsp&nbsp&nbsp&nbsp&nbsp&nbsp&nbsp&nbsp&nbsp a")
    }
    document.write("<br>")
}

for (i=1; i<=b; i++) {
    document.write("*");
}
  </script> 
</head>  
<body>  
</body>  
</html>
